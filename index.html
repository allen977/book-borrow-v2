<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>扫码借书 / 还书</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(135deg,#6366f1,#8b5cf6);min-height:100vh;margin:0;padding:24px}
.card{background:#fff;border-radius:16px;padding:24px;max-width:480px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{font-size:22px;text-align:center;color:#333}
.tabs{display:flex;gap:10px;margin:18px 0}
.tab{flex:1;text-align:center;padding:10px;border-radius:8px;background:#f1f3f5;color:#666;font-weight:700;cursor:pointer}
.tab.active{background:#6366f1;color:#fff}
label{display:block;margin:12px 0 6px;color:#333;font-weight:500}
input{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:16px;box-sizing:border-box}
button.go{width:100%;margin-top:16px;padding:14px;background:#6366f1;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:700}
.msg{margin-top:14px;padding:10px;border-radius:8px;display:none}
.ok{background:#d1fae5;color:#065f46;display:block}
.err{background:#fee2e2;color:#991b1b;display:block}
.warn{background:#fef3c7;color:#92400e;display:block}
.item{padding:12px;border:2px solid #e5e7eb;border-radius:8px;margin-bottom:10px}
.item.sel{border-color:#6366f1;background:#eef2ff}
.item.overdue{border-color:#ef4444;background:#fef2f2}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;margin-left:6px}
.badge-over{background:#ef4444;color:#fff}
a.admin{display:block;text-align:center;margin-top:18px;color:#6366f1}
</style>
</head>
<body>
<div class="card">
  <h1>📚 图书借还</h1>
  <div class="tabs">
    <div id="tabBorrow" class="tab active" onclick="sw('borrow')">借书</div>
    <div id="tabReturn" class="tab" onclick="sw('return')">还书</div>
  </div>

  <div id="borrowBox">
    <label>姓名</label><input id="name" placeholder="张三" />
    <label>手机号</label><input id="phone" placeholder="13800000000" />
    <label>书名</label><input id="book" placeholder="自动识别中..." />
    <button class="go" onclick="doBorrow()">确认借书</button>
    <p style="font-size:12px;color:#999;margin-top:8px">规则：每人最多借 2 本，每本最多借 14 天</p>
  </div>

  <div id="returnBox" style="display:none">
    <label>借书手机号</label>
    <input id="rphone" placeholder="13800000000" />
    <button class="go" onclick="loadMine()">查询我的书</button>
    <div id="mine" style="margin-top:14px"></div>
    <button class="go" id="returnBtn" disabled onclick="doReturn()">确认还书</button>
  </div>

  <div class="msg" id="msg"></div>
  <a class="admin" href="/admin">管理后台</a>
</div>

<script>
const API = location.origin

// 扫码自动填书名
const book = new URLSearchParams(location.search).get('book')
if (book) document.getElementById('book').value = decodeURIComponent(book)

function sw(t){
  const b = t === 'borrow'
  document.getElementById('tabBorrow').classList.toggle('active', b)
  document.getElementById('tabReturn').classList.toggle('active', !b)
  document.getElementById('borrowBox').style.display = b ? 'block' : 'none'
  document.getElementById('returnBox').style.display = b ? 'none' : 'block'
}
function say(m, c){ const x = document.getElementById('msg'); x.textContent = m; x.className = 'msg ' + c }

async function doBorrow(){
  const name = nameEl.value.trim(), phone = phoneEl.value.trim(), book = bookEl.value.trim()
  if(!name || !phone || !book) return say('请填写完整','err')
  const r = await fetch(API + '/api/borrow', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, phone, book})
  })
  const d = await r.json()
  if(d.success) { say('✅ 借书成功','ok'); nameEl.value=''; phoneEl.value=''; bookEl.value='' }
  else say('❌ ' + (d.error || '失败'), 'err')
}
const nameEl = document.getElementById('name')
const phoneEl = document.getElementById('phone')
const bookEl = document.getElementById('book')

let selId = null
async function loadMine(){
  const phone = document.getElementById('rphone').value.trim()
  if(!phone) return say('输入手机号','err')
  const r = await fetch(API + '/api/active?phone=' + encodeURIComponent(phone))
  const d = await r.json()
  const box = document.getElementById('mine')
  selId = null; document.getElementById('returnBtn').disabled = true
  if(!d.list.length){ box.innerHTML = '<p style="color:#999">没有借出中的书</p>'; return }
  box.innerHTML = d.list.map(x => `
    <div class="item ${x.overdue ? 'overdue' : ''}" onclick="sel(${x.id}, this)">
      <b>${x.book}</b>
      ${x.overdue ? `<span class="badge badge-over">超期 ${x.overdueDays} 天</span>` : ''}
      <br/><small>${x.name} · ${x.phone}<br/>借于 ${x.borrow_time}</small>
    </div>`).join('')
}
function sel(id, el){
  selId = id
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('sel'))
  el.classList.add('sel')
  document.getElementById('returnBtn').disabled = false
}
async function doReturn(){
  const r = await fetch(API + '/api/return', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id: selId})
  })
  const d = await r.json()
  if(d.success){ say('✅ 还书成功','ok'); loadMine() }
  else say('❌ ' + (d.error || '失败'), 'err')
}
</script>
</body>
</html>
